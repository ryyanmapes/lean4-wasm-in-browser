name: Browser game Docker release
run-name: Build browser game image

on:
  workflow_dispatch:
    inputs:
      lean4game_ref:
        description: lean4game branch, tag, or SHA
        required: false
        default: main
        type: string
      nng4_ref:
        description: NNG4 branch, tag, or SHA
        required: false
        default: main
        type: string
      visualtest_ref:
        description: VisualTest branch, tag, or SHA
        required: false
        default: main
        type: string
      experimental_mobile_modules:
        description: Include the opt-in validated loose-module mobile runtime
        required: true
        default: false
        type: boolean
      experimental_one_worker:
        description: Publish an isolated one-worker pthread image without replacing latest
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: browser-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-runtime:
    name: Build Lean WASM snapshot artifact
    uses: ryyanmapes/lean4game/.github/workflows/build-browser-lean-libs.yml@main
    with:
      lean4game_ref: ${{ inputs.lean4game_ref || 'main' }}
      nng4_ref: ${{ inputs.nng4_ref || 'main' }}
      visualtest_ref: ${{ inputs.visualtest_ref || 'main' }}
      include_nng4: true
      experimental_size_profiles: ${{ inputs.experimental_mobile_modules || false }}
      experimental_one_worker: ${{ inputs.experimental_one_worker || false }}
    secrets:
      CAULI_ARTIFACT_TOKEN: ${{ secrets.CAULI_ARTIFACT_TOKEN }}

  docker:
    name: Assemble and publish browser game
    needs: browser-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out lean4.js release shell
        uses: actions/checkout@v4
        with:
          path: lean4.js

      - name: Check out Lean4Game client
        uses: actions/checkout@v4
        with:
          repository: ryyanmapes/lean4game
          ref: ${{ inputs.lean4game_ref || 'main' }}
          path: Lean4Game/lean4game

      - name: Check out NNG4
        uses: actions/checkout@v4
        with:
          repository: ryyanmapes/NNG4
          ref: ${{ inputs.nng4_ref || 'main' }}
          path: Lean4Game/NNG4

      - name: Check out VisualTest
        uses: actions/checkout@v4
        with:
          repository: ryyanmapes/VisualTest
          ref: ${{ inputs.visualtest_ref || 'main' }}
          path: Lean4Game/VisualTest

      - name: Download Lean WASM runtime and snapshot
        uses: actions/download-artifact@v4
        with:
          pattern: visual-lean-libs-*
          merge-multiple: true
          path: visual-lean-artifact

      - name: Verify runtime artifact
        run: |
          mkdir -p visual-lean-artifact/modules
          test -s visual-lean-artifact/runtime/lean.js
          test -s visual-lean-artifact/runtime/lean.wasm
          test -s visual-lean-artifact/snapshots/game.snap.gz
          test -s visual-lean-artifact/gamedata/NNG4/game.json
          test -s visual-lean-artifact/gamedata/VisualTest/game.json
          if [[ "${{ inputs.experimental_mobile_modules || false }}" == "true" ]]; then
            test -s visual-lean-artifact/modules/game-modules.tar.gz
          fi
          du -sh visual-lean-artifact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ !inputs.experimental_one_worker }}
            type=raw,value=one-worker-experimental,enable=${{ inputs.experimental_one_worker }}
            type=sha,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=The Natural Numbers Game
            org.opencontainers.image.description=Browser-local NNG4 and Visual Lean, formally checked by Lean WASM

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: lean4.js/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Smoke-test the published image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.experimental_one_worker && 'one-worker-experimental' || 'latest' }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --detach --name lean4-wasm-release-smoke --publish 8080:80 "$IMAGE"
          cleanup() {
            docker rm --force lean4-wasm-release-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs lean4-wasm-release-smoke
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/lean4game/index.html >/dev/null
          curl --fail --silent --show-error \
            http://127.0.0.1:8080/lean4game/data/g/local/NNG4/game.json >/dev/null
          curl --fail --silent --show-error \
            http://127.0.0.1:8080/lean4game/data/g/local/VisualTest/game.json >/dev/null
          curl --fail --silent --show-error \
            http://127.0.0.1:8080/visual-lean/snapshots/game.snap.gz >/dev/null
          if [[ "${{ inputs.experimental_mobile_modules || false }}" == "true" ]]; then
            curl --fail --silent --show-error \
              http://127.0.0.1:8080/visual-lean/modules/game-modules.tar.gz >/dev/null
          fi
          curl --fail --silent --show-error --head http://127.0.0.1:8080/ \
            | grep --ignore-case '^Cross-Origin-Opener-Policy: same-origin'
          curl --fail --silent --show-error --head http://127.0.0.1:8080/ \
            | grep --ignore-case '^Cross-Origin-Embedder-Policy: require-corp'

      - name: Set up Node for runtime benchmarks
        if: inputs.experimental_one_worker
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Lean4Game/lean4game/package-lock.json

      - name: Install Cypress benchmark dependencies
        if: inputs.experimental_one_worker
        working-directory: Lean4Game/lean4game
        run: npm ci

      - name: Benchmark four-worker and one-worker runtimes
        if: inputs.experimental_one_worker
        working-directory: Lean4Game/lean4game
        env:
          THREADED_IMAGE: ghcr.io/${{ github.repository }}:latest
          ONE_WORKER_IMAGE: ghcr.io/${{ github.repository }}:one-worker-experimental
        run: |
          set -euo pipefail
          cleanup() {
            docker rm --force benchmark-threaded benchmark-one-worker >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p cypress/results

          docker pull "$THREADED_IMAGE"
          docker run --detach --name benchmark-threaded --publish 8081:80 "$THREADED_IMAGE"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8081/ >/dev/null && break
            sleep 1
          done
          for sample in 1 2 3; do
            node scripts/run-cypress.cjs run \
              --spec cypress/e2e/runtime-performance.cy.ts \
              --browser chrome \
              --config baseUrl=http://127.0.0.1:8081,defaultCommandTimeout=60000,pageLoadTimeout=600000 \
              --env LEAN4GAME_ENTRY=/lean4game/index.html?mobileModules=1,LEAN4GAME_MOUNT=/lean4game/index.html?mobileModules=1,VISUAL_TIMEOUT=600000,BENCHMARK_VARIANT=threaded-$sample
          done
          docker rm --force benchmark-threaded

          docker pull "$ONE_WORKER_IMAGE"
          docker run --detach --name benchmark-one-worker --publish 8082:80 "$ONE_WORKER_IMAGE"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8082/ >/dev/null && break
            sleep 1
          done
          for sample in 1 2 3; do
            node scripts/run-cypress.cjs run \
              --spec cypress/e2e/runtime-performance.cy.ts \
              --browser chrome \
              --config baseUrl=http://127.0.0.1:8082,defaultCommandTimeout=60000,pageLoadTimeout=600000 \
              --env LEAN4GAME_ENTRY=/lean4game/index.html?mobileModules=1,LEAN4GAME_MOUNT=/lean4game/index.html?mobileModules=1,VISUAL_TIMEOUT=600000,BENCHMARK_VARIANT=one-worker-$sample
          done
          node scripts/run-cypress.cjs run \
            --spec cypress/e2e/nng4-visual-complete-playthrough.cy.ts \
            --browser chrome \
            --config baseUrl=http://127.0.0.1:8082,defaultCommandTimeout=60000,pageLoadTimeout=600000 \
            --env LEAN4GAME_ENTRY=/lean4game/index.html?mobileModules=1,LEAN4GAME_MOUNT=/lean4game/index.html?mobileModules=1,VISUAL_TIMEOUT=600000

      - name: Upload runtime benchmark results
        if: always() && inputs.experimental_one_worker
        uses: actions/upload-artifact@v4
        with:
          name: runtime-threading-benchmark-${{ github.run_id }}
          path: Lean4Game/lean4game/cypress/results
          if-no-files-found: warn
          retention-days: 14

      - name: Release summary
        run: |
          {
            echo '### Published container'
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo
            echo 'Run with:'
            echo
            echo '```bash'
            echo 'docker run --rm -p 8080:80 ghcr.io/${{ github.repository }}:latest'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
