name: Browser runtime worker benchmark
run-name: Compare four-worker and one-worker Lean runtimes

on:
  workflow_dispatch:
    inputs:
      lean4game_ref:
        description: Lean4Game commit containing the benchmark suite
        required: true
        default: 73a71d8805377bedd862717c5f301f3086b178db
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out Lean4Game tests
        uses: actions/checkout@v4
        with:
          repository: ryyanmapes/lean4game
          ref: ${{ inputs.lean4game_ref }}

      - name: Check out benchmark host override
        uses: actions/checkout@v4
        with:
          path: benchmark-host

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps puppeteer-core@24

      - name: Run isolated-browser A/B timings
        env:
          THREADED_IMAGE: ghcr.io/ryyanmapes/lean4-wasm-in-browser:latest
          ONE_WORKER_IMAGE: ghcr.io/ryyanmapes/lean4-wasm-in-browser:one-worker-experimental
        run: |
          set -euo pipefail
          cleanup() {
            docker rm --force benchmark-threaded benchmark-one-worker >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p cypress/results
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          "$CHROME_PATH" --version

          docker pull "$THREADED_IMAGE"
          docker run --detach --name benchmark-threaded --publish 8081:80 \
            --volume "$PWD/benchmark-host/public/lean-worker-persistent.worker.js:/usr/share/nginx/html/lean-worker-persistent.worker.js:ro" \
            "$THREADED_IMAGE"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8081/ >/dev/null && break
            sleep 1
          done
          node scripts/run-runtime-benchmark.mjs http://127.0.0.1:8081 four-worker 3
          docker rm --force benchmark-threaded

          docker pull "$ONE_WORKER_IMAGE"
          docker run --detach --name benchmark-one-worker --publish 8082:80 \
            --volume "$PWD/benchmark-host/public/lean-worker-persistent.worker.js:/usr/share/nginx/html/lean-worker-persistent.worker.js:ro" \
            "$ONE_WORKER_IMAGE"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8082/ >/dev/null && break
            sleep 1
          done
          node scripts/run-runtime-benchmark.mjs http://127.0.0.1:8082 one-worker 3

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-worker-benchmark-${{ github.run_id }}
          path: |
            cypress/results
          if-no-files-found: warn
          retention-days: 14
