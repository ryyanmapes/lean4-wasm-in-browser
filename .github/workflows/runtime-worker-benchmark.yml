name: Browser runtime worker benchmark
run-name: Compare four-worker and one-worker Lean runtimes

on:
  workflow_dispatch:
    inputs:
      lean4game_ref:
        description: Lean4Game commit containing the benchmark suite
        required: true
        default: b8fe2844e0a3b6ab05ac8a364223d3f9c7478bee
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out Lean4Game tests
        uses: actions/checkout@v4
        with:
          repository: ryyanmapes/lean4game
          ref: ${{ inputs.lean4game_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Run A/B timings and one-worker playthrough
        env:
          THREADED_IMAGE: ghcr.io/ryyanmapes/lean4-wasm-in-browser:latest
          ONE_WORKER_IMAGE: ghcr.io/ryyanmapes/lean4-wasm-in-browser:one-worker-experimental
        run: |
          set -euo pipefail
          cleanup() {
            docker rm --force benchmark-threaded benchmark-one-worker >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p cypress/results

          docker pull "$THREADED_IMAGE"
          docker run --detach --name benchmark-threaded --publish 8081:80 "$THREADED_IMAGE"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8081/ >/dev/null && break
            sleep 1
          done
          for sample in 1 2 3; do
            node scripts/run-cypress.cjs run \
              --spec cypress/e2e/runtime-performance.cy.ts \
              --browser electron \
              --config baseUrl=http://127.0.0.1:8081,defaultCommandTimeout=60000,pageLoadTimeout=600000 \
              --env LEAN4GAME_ENTRY=/lean4game/index.html?mobileModules=1,LEAN4GAME_MOUNT=/lean4game/index.html?mobileModules=1,VISUAL_TIMEOUT=600000,BENCHMARK_VARIANT=four-worker-$sample
          done
          docker rm --force benchmark-threaded

          docker pull "$ONE_WORKER_IMAGE"
          docker run --detach --name benchmark-one-worker --publish 8082:80 "$ONE_WORKER_IMAGE"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8082/ >/dev/null && break
            sleep 1
          done
          for sample in 1 2 3; do
            node scripts/run-cypress.cjs run \
              --spec cypress/e2e/runtime-performance.cy.ts \
              --browser electron \
              --config baseUrl=http://127.0.0.1:8082,defaultCommandTimeout=60000,pageLoadTimeout=600000 \
              --env LEAN4GAME_ENTRY=/lean4game/index.html?mobileModules=1,LEAN4GAME_MOUNT=/lean4game/index.html?mobileModules=1,VISUAL_TIMEOUT=600000,BENCHMARK_VARIANT=one-worker-$sample
          done
          node scripts/run-cypress.cjs run \
            --spec cypress/e2e/nng4-visual-complete-playthrough.cy.ts \
            --browser electron \
            --config baseUrl=http://127.0.0.1:8082,defaultCommandTimeout=60000,pageLoadTimeout=600000 \
            --env LEAN4GAME_ENTRY=/lean4game/index.html?mobileModules=1,LEAN4GAME_MOUNT=/lean4game/index.html?mobileModules=1,VISUAL_TIMEOUT=600000

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-worker-benchmark-${{ github.run_id }}
          path: |
            cypress/results
            cypress/screenshots
          if-no-files-found: warn
          retention-days: 14
