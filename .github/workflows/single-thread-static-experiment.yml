name: Single-thread static-hosting experiment

on:
  push:
    branches:
      - single-thread-static-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-runtime:
    uses: ryyanmapes/lean4game/.github/workflows/build-browser-lean-libs.yml@single-thread-static-experiment
    with:
      lean4game_ref: single-thread-static-experiment
      nng4_ref: main
      visualtest_ref: main
      include_nng4: true
      experimental_size_profiles: true
      experimental_one_worker: false
      experimental_single_thread: true
      single_thread_lean_sha: 72a8f89f3126d2c149361d1285b000f5e77d7313
      single_thread_lean_run_id: '30858803276'
    secrets:
      CAULI_ARTIFACT_TOKEN: ${{ secrets.CAULI_ARTIFACT_TOKEN }}

  static-site:
    needs: browser-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out static host shell
        uses: actions/checkout@v4
        with:
          path: lean4.js

      - name: Check out experimental Lean4Game client
        uses: actions/checkout@v4
        with:
          repository: ryyanmapes/lean4game
          ref: single-thread-static-experiment
          path: Lean4Game/lean4game

      - name: Check out game sources
        uses: actions/checkout@v4
        with:
          repository: ryyanmapes/NNG4
          ref: main
          path: Lean4Game/NNG4

      - uses: actions/checkout@v4
        with:
          repository: ryyanmapes/VisualTest
          ref: main
          path: Lean4Game/VisualTest

      - name: Download single-thread runtime and game data
        uses: actions/download-artifact@v4
        with:
          pattern: visual-lean-libs-*
          merge-multiple: true
          path: visual-lean-artifact

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean4.js/public/visual-lean/{runtime,snapshots,modules}
          cp -a visual-lean-artifact/runtime/. lean4.js/public/visual-lean/runtime/
          cp -a visual-lean-artifact/snapshots/. lean4.js/public/visual-lean/snapshots/
          cp -a visual-lean-artifact/modules/. lean4.js/public/visual-lean/modules/
          cp visual-lean-artifact/build-info.json lean4.js/public/visual-lean/build-info.json
          mkdir -p Lean4Game/NNG4/.lake/gamedata Lean4Game/VisualTest/.lake/gamedata
          cp -a visual-lean-artifact/gamedata/NNG4/. Lean4Game/NNG4/.lake/gamedata/
          cp -a visual-lean-artifact/gamedata/VisualTest/. Lean4Game/VisualTest/.lake/gamedata/
          ! grep -q 'PThread' lean4.js/public/visual-lean/runtime/lean.js
          node -e "const i=require('./lean4.js/public/visual-lean/build-info.json'); if (!i.singleThread || i.runtimeThreads !== 0) process.exit(1)"
          (cd Lean4Game/lean4game && npm ci)
          (cd lean4.js && npm ci && npm run sync-lean4game-client && npm run build)
          test -s lean4.js/dist/visual-lean/runtime/lean.wasm
          test -s lean4.js/dist/visual-lean/modules/game-modules.tar.gz

      - name: Install isolated-browser validator
        working-directory: Lean4Game/lean4game
        run: npm install --no-save --package-lock=false --legacy-peer-deps puppeteer-core@24

      - name: Validate all levels without isolation headers
        shell: bash
        working-directory: Lean4Game/lean4game
        env:
          EXPECT_CROSS_ORIGIN_ISOLATED: 'false'
          VISUAL_TIMEOUT: '600000'
        run: |
          set -euo pipefail
          python3 -m http.server 8085 --directory ../../lean4.js/dist >/tmp/static-site.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8085/ >/dev/null && break
            sleep 1
          done
          if curl --silent --head http://127.0.0.1:8085/ | grep --ignore-case -q '^Cross-Origin-'; then
            echo '::error::The static test server unexpectedly supplied cross-origin isolation headers.'
            exit 1
          fi
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          node scripts/run-mobile-module-playthrough.mjs \
            http://127.0.0.1:8085 single-thread-static-all-levels

      - name: Upload static site and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-thread-static-site-${{ github.run_id }}
          path: |
            lean4.js/dist
            Lean4Game/lean4game/cypress/results/single-thread-static-all-levels.json
            Lean4Game/lean4game/cypress/results/single-thread-static-all-levels-failure.png
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
