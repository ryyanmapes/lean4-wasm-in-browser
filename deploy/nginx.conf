server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    gzip off;

    # The pthread Lean build uses SharedArrayBuffer. These headers must be
    # present on cold loads, refreshes, workers, WASM, and the embedded app.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /lean4game {
        return 301 /lean4game/;
    }

    location /lean4game/ {
        try_files $uri $uri/ =404;
        expires 1h;
    }

    location ^~ /lean4game/assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~* \.wasm$ {
        types {
            application/wasm wasm;
        }
        try_files $uri =404;
        expires 1h;
    }

    location ~* \.snap\.gz$ {
        try_files $uri =404;
        expires 1h;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
